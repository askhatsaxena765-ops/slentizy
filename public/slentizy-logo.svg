<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Top ribbon gradient -->
    <linearGradient id="slentizyTopRibbon" x1="20%" y1="10%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Bottom ribbon gradient -->
    <linearGradient id="slentizyBottomRibbon" x1="10%" y1="20%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="55%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Fold shadow gradient -->
    <linearGradient id="slentizyFoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Play triangle gradient -->
    <linearGradient id="slentizyPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9333ea" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Group with glow -->
  <g filter="url(#purpleGlow)">
    <!-- Top Ribbon Curl of S -->
    <path
      d="M72 26 C88 26 96 38 90 48 C85 56 68 62 52 64 C42 65 38 60 40 52 C42 42 58 35 72 26 Z"
      fill="url(#slentizyTopRibbon)"
    />
    
    <!-- Top Loop outer fold overlay for 3D depth -->
    <path
      d="M48 34 C58 25 80 23 90 35 C95 41 93 49 84 54 C72 61 54 62 46 56 C40 50 42 40 48 34 Z"
      fill="url(#slentizyTopRibbon)"
      opacity="0.9"
    />

    <!-- Bottom Ribbon Curl of S -->
    <path
      d="M46 94 C30 94 22 82 28 72 C33 64 50 58 66 56 C76 55 80 60 78 68 C76 78 60 85 46 94 Z"
      fill="url(#slentizyBottomRibbon)"
    />

    <!-- Bottom Loop outer fold overlay -->
    <path
      d="M70 86 C60 95 38 97 28 85 C23 79 25 71 34 66 C46 59 64 58 72 64 C78 70 76 80 70 86 Z"
      fill="url(#slentizyBottomRibbon)"
      opacity="0.95"
    />

    <!-- Central Inner Fold shadow -->
    <path
      d="M48 54 C54 52 64 52 70 56 C66 62 56 65 48 64 Z"
      fill="url(#slentizyFoldShadow)"
    />

    <!-- Central Play Triangle pointing right -->
    <polygon
      points="54,48 54,72 74,60"
      fill="url(#slentizyPlayGrad)"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
  </g>
</svg>
