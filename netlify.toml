[build]
  command = "npm run build"
  publish = "dist"

# Netlify Functions directory.
# NOTE: function files MUST use the .cjs extension because package.json sets
# "type": "module". A .js file would be parsed as ESM and the CommonJS
# `exports.handler` assignment would be silently ignored, causing Netlify to
# return 502 for every /api/* request.
[functions]
  directory = "netlify/functions"

# Redirect /api/* requests to the Netlify Functions runtime.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200